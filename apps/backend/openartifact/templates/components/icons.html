{# Inline SVG icon macro (Lucide-style, stroke = currentColor). Add new icons here, and to `icon_names`:
   base.html renders every icon once into <template id="icons"> for static/js/components/icons.js. #}
{% set icon_names = ["board", "pipeline", "action", "play", "stop", "layers", "logout", "pencil", "chevrons-left", "sun", "moon", "inbox", "parent", "columns", "chevrons-right", "plus", "trash", "x", "check", "logo", "code", "http", "clock", "list"] %}
{% macro icon(name, class="") -%}
<svg class="icon {{ class }}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
{%- if name == "board" %}<rect x="3" y="3" width="5" height="18" rx="1.5"/><rect x="10" y="3" width="5" height="12" rx="1.5"/><rect x="17" y="3" width="4" height="8" rx="1.5"/>
{%- elif name == "pipeline" %}<circle cx="5" cy="12" r="2"/><circle cx="19" cy="12" r="2"/><path d="M7 12h10"/><path d="m14 9 3 3-3 3"/>
{%- elif name == "action" %}<path d="M13 2 4 14h7l-1 8 9-12h-7Z"/>
{%- elif name == "play" %}<path d="m6 4 14 8-14 8Z"/>
{%- elif name == "stop" %}<rect x="5" y="5" width="14" height="14" rx="2"/>
{%- elif name == "layers" %}<path d="m12 3 9 5-9 5-9-5 9-5Z"/><path d="m3 13 9 5 9-5"/>
{%- elif name == "logout" %}<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5"/><path d="M21 12H9"/>
{%- elif name == "pencil" %}<path d="M17 3a2.85 2.85 0 0 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/>
{%- elif name == "chevrons-left" %}<path d="m11 17-5-5 5-5"/><path d="m18 17-5-5 5-5"/>
{%- elif name == "sun" %}<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/>
{%- elif name == "moon" %}<path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>
{%- elif name == "inbox" %}<path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11Z"/>
{%- elif name == "parent" %}<path d="M14 9 9 4 4 9"/><path d="M20 20h-7a4 4 0 0 1-4-4V4"/>
{%- elif name == "columns" %}<rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 3v18M15 3v18"/>
{%- elif name == "chevrons-right" %}<path d="m6 17 5-5-5-5"/><path d="m13 17 5-5-5-5"/>
{%- elif name == "plus" %}<path d="M12 5v14M5 12h14"/>
{%- elif name == "trash" %}<path d="M3 6h18"/><path d="M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/>
{%- elif name == "x" %}<path d="M18 6 6 18M6 6l12 12"/>
{%- elif name == "check" %}<path d="M20 6 9 17l-5-5"/>
{%- elif name == "logo" %}<path d="m12 3 8 4.5v9L12 21l-8-4.5v-9L12 3Z"/><path d="m12 12 8-4.5M12 12v9M12 12 4 7.5"/>
{%- elif name == "code" %}<path d="m16 18 6-6-6-6"/><path d="m8 6-6 6 6 6"/>
{%- elif name == "http" %}<circle cx="12" cy="12" r="9"/><path d="M3 12h18"/><path d="M12 3a14 14 0 0 1 0 18 14 14 0 0 1 0-18Z"/>
{%- elif name == "clock" %}<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>
{%- elif name == "list" %}<path d="M8 6h13M8 12h13M8 18h13"/><path d="M3 6h.01M3 12h.01M3 18h.01"/>
{%- endif %}</svg>
{%- endmacro %}
