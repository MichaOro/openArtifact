{% from "components/modal.html" import modal %}
{% from "components/icons.html" import icon %}
{% call modal("create-task-modal", "Create Artifact", subtitle=True) %}
<div class="modal__layout">
<section class="task-view" data-task-view hidden>
    <div class="modal__body">
        <h3 class="task-view__title" data-view-title></h3>
        <p class="task-view__body" data-view-body></p>
    </div>
    <footer class="modal__footer">
        <button type="button" class="button button--ghost modal__footer-start" data-view-back hidden>Back</button>
        <button type="button" class="button button--ghost" data-modal-close>Close</button>
        <button type="button" class="button button--primary" data-view-edit>Edit</button>
    </footer>
</section>
<form class="task-form" id="create-task-form" novalidate>
    <div class="modal__body">
        <div class="field">
            <label class="field__label" for="task-title">Title <span class="field__required" aria-hidden="true">*</span></label>
            <input class="field__control" id="task-title" name="title" type="text" required
                   maxlength="255" autocomplete="off" placeholder="Enter artifact title..."
                   aria-required="true" aria-describedby="task-title-error" data-autofocus>
            <p class="field__error" id="task-title-error" role="alert" hidden></p>
        </div>
        <div class="field">
            <label class="field__label" for="task-body">Body <span class="field__hint">(optional)</span></label>
            <textarea class="field__control" id="task-body" name="body" rows="6"
                      maxlength="10000" placeholder="Describe your artifact..."></textarea>
        </div>
        <p class="form-error" role="alert" hidden data-form-error></p>
    </div>
    <footer class="modal__footer">
        <button type="button" class="button button--ghost" data-cancel>Cancel</button>
        <button type="submit" class="button button--primary" data-submit>
            <span class="spinner" aria-hidden="true"></span>
            <span data-submit-label>Create Artifact</span>
        </button>
    </footer>
</form>
<aside class="card-nav" data-card-nav data-state="collapsed" aria-label="Artifact details" hidden>
    <ul class="nav-list card-nav__fields">
        <li>
            <button type="button" class="nav-link card-nav__field" data-card-field="lane"
                    aria-haspopup="listbox" aria-expanded="false" title="Lane">
                {{ icon("columns") }}
                <span class="nav-link__label">
                    <span class="card-nav__key">Lane</span>
                    <span class="card-nav__value" data-lane-value></span>
                </span>
            </button>
        </li>
        <li>
            <button type="button" class="nav-link card-nav__field" data-card-field="parent"
                    aria-haspopup="listbox" aria-expanded="false" title="Parent artifact">
                {{ icon("parent") }}
                <span class="nav-link__label">
                    <span class="card-nav__key">Parent</span>
                    <span class="card-nav__value"><span data-parent-value>None</span></span>
                </span>
            </button>
        </li>
    </ul>
    <ul class="nav-list card-nav__actions">
        <li>
            <button type="button" class="nav-link nav-link--danger" data-card-action="delete" title="Delete artifact">
                {{ icon("trash") }}
                <span class="nav-link__label">Delete</span>
            </button>
        </li>
    </ul>
    <button type="button" class="icon-button icon-button--sm card-nav__toggle" data-card-nav-toggle
            aria-controls="card-nav-fields" aria-expanded="false" aria-label="Expand artifact details">
        {{ icon("chevrons-right") }}
    </button>
</aside>
</div>
{% endcall %}
