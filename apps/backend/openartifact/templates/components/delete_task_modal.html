{% from "components/modal.html" import modal %}
{% call modal("delete-task-modal", "Delete Artifact") %}
<div class="modal__body">
    <p class="confirm-text">Delete <strong class="confirm-text__subject" data-task-title></strong>? This cannot be undone.</p>
    <p class="confirm-text" data-children-note hidden></p>
    <p class="form-error" role="alert" hidden data-form-error></p>
</div>
<footer class="modal__footer">
    <button type="button" class="button button--ghost" data-modal-close data-cancel>Cancel</button>
    <button type="button" class="button button--danger" data-confirm>
        <span class="spinner" aria-hidden="true"></span>
        <span>Delete</span>
    </button>
</footer>
{% endcall %}
