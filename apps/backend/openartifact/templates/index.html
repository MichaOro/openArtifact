<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OpenArtifact</title>
    <script src="https://unpkg.com/htmx.org@2.0.4/dist/htmx.min.js" integrity="sha384-HGfztofotfshcS78nMc+BLRH/ePg6jj8HesnzV7loHiNrjOXbcOeusqZRCWsXKeAJ" crossorigin="anonymous"></script>
    <style>
        :root {
            --color-bg: #ffffff;
            --color-text: #1a1a2e;
            --color-primary: #16213e;
            --color-secondary: #0f3460;
            --color-accent: #e94560;
            --color-muted: #6c757d;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            max-width: 900px;
            margin: 0 auto;
            padding: 2rem;
            color: var(--color-text);
            background-color: var(--color-bg);
        }
        h1 {
            color: var(--color-primary);
            border-bottom: 2px solid var(--color-accent);
            padding-bottom: 0.5rem;
        }
        h2 {
            color: var(--color-secondary);
            font-size: 1.2rem;
            margin-top: 2rem;
        }
        .version {
            color: var(--color-muted);
            font-size: 0.9rem;
        }
        nav {
            margin: 1.5rem 0;
            padding: 1rem;
            background: #f8f9fa;
            border-radius: 8px;
        }
        nav a {
            margin-right: 1.5rem;
            color: var(--color-secondary);
            text-decoration: none;
        }
        nav a:hover {
            color: var(--color-accent);
            text-decoration: underline;
        }
        .status {
            padding: 0.75rem;
            background: #e8f5e9;
            border-left: 4px solid #4caf50;
            border-radius: 4px;
            margin: 1rem 0;
        }
        .status::before {
            content: "✓ ";
            font-weight: bold;
        }
        footer {
            margin-top: 3rem;
            padding-top: 1rem;
            border-top: 1px solid #dee2e6;
            color: var(--color-muted);
            font-size: 0.85rem;
        }
    </style>
</head>
<body>
    <h1>OpenArtifact</h1>
    <p class="version">Version 0.1.0</p>

    <div class="status">Application is running</div>

    <nav>
        <a href="/api/health">Health Check</a>
        <a href="/api/info">Application Info</a>
        <a href="#" hx-get="/health" hx-target="#health-status">Refresh Status</a>
    </nav>

    <div id="health-status">
        <h2>System Status</h2>
        <p id="health-text">Click "Refresh Status" to check health via HTMX</p>
    </div>

    <footer>
        OpenArtifact &mdash; Orchestrate projects, workflows, and AI agents
    </footer>
</body>
</html>
