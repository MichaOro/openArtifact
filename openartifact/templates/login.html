{% extends "base_bare.html" %}
{% from "components/icons.html" import icon %}
{% block title %}{{ t('page.sign_in') }} · OpenArtifact{% endblock %}
{% block body %}
    <main class="signin">
        <form class="signin__card glass" method="post" action="/login">
            <div class="signin__brand">
                <span class="sidebar__logo">{{ icon("logo") }}</span>
                <span>OpenArtifact</span>
            </div>
            <input type="hidden" name="next" value="{{ next }}">
            <div class="field">
                <label class="field__label" for="token">{{ t('login.api_token') }}</label>
                <input class="field__control" id="token" name="token" type="password" required autofocus
                       autocomplete="current-password" aria-describedby="signin-error">
                <p class="field__error" id="signin-error" role="alert" {% if not error %}hidden{% endif %}>{{ error }}</p>
            </div>
            <button type="submit" class="button button--primary">{{ t('login.sign_in') }}</button>
            {% if sso_label %}
            <a class="button button--ghost" href="/login/sso?next={{ next | urlencode }}">{{ sso_label }}</a>
            {% endif %}
        </form>
    </main>
{% endblock %}
