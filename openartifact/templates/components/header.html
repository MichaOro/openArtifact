{% from "components/icons.html" import icon %}
<header class="app-header">
    <h1 class="app-header__title">{{ t(page_title) }}</h1>
    <div class="app-header__tools">
        <button type="button" class="icon-button" data-language-toggle aria-haspopup="menu" aria-expanded="false"
                aria-label="{{ t('header.language') }}" title="{{ t('header.language') }}">
            {{ icon("globe") }}
        </button>
        <button type="button" class="icon-button theme-toggle" data-theme-toggle
                aria-pressed="false" aria-label="{{ t('header.switch_theme') }}">
            {{ icon("sun", "icon--sun") }}{{ icon("moon", "icon--moon") }}
        </button>
        {% if auth_enabled %}
        <form method="post" action="/logout">
            <button type="submit" class="icon-button" aria-label="{{ t('header.sign_out') }}" title="{{ t('header.sign_out') }}">{{ icon("logout") }}</button>
        </form>
        {% endif %}
    </div>
</header>
