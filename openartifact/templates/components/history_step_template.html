{# One step of an execution (behaviour in static/js/tasks/history-step.js): the History tab and the flow page. #}
<template id="history-step-template">
    <li class="history-step">
        <div class="history-step__head">
            <span class="history-step__seq" data-step-seq></span>
            <span class="history-step__kind" data-step-kind-icon></span>
            <span class="history-step__name"><span data-step-name></span> <span class="history-step__kind-text" data-step-kind></span> <span class="history-flag" data-step-mock hidden>{{ t('tasks.history_step.mock_flag') }}</span></span>
            <span class="history-chip" data-step-outcome><span data-chip-icon></span><span data-chip-text></span></span>
        </div>
        <p class="history-step__where" data-step-where hidden></p>
        <p class="history-step__facts" data-step-facts></p>
        <p class="history-step__reason" data-step-reason hidden></p>
        <p class="history-step__keep" data-step-keep hidden>
            <button type="button" class="button button--ghost button--sm" data-step-keep-mock>{{ t('tasks.history_step.keep_mock') }}</button>
            <span class="field__help" data-step-keep-note role="status"></span>
        </p>
        <div class="history-step__context" data-step-context hidden>
            <p class="history-step__context-title" data-step-context-title></p>
            <ul class="history-step__context-list" data-step-context-included></ul>
            <p class="history-step__context-title" data-step-context-omitted-title></p>
            <ul class="history-step__context-list history-step__context-list--omitted" data-step-context-omitted></ul>
        </div>
        <details class="history-step__block" data-step-output hidden>
            <summary>{{ t('common.output') }}</summary>
            <pre class="history-step__pre" tabindex="0"></pre>
            <p class="field__help" data-step-truncated hidden>{{ t('history_step.the_output_was_cut_off_only') }}</p>
        </details>
        <details class="history-step__block" data-step-agent hidden>
            <summary>{{ t('history_step.request_prompts_inputs_attempts') }}</summary>
            <div class="history-step__agent" data-step-agent-body></div>
        </details>
        <details class="history-step__block" data-step-tries hidden>
            <summary data-step-tries-summary></summary>
            <ol class="history-step__tries" data-step-tries-body></ol>
        </details>
        <details class="history-step__block" data-step-data hidden>
            <summary>{{ t('common.data') }}</summary>
            <pre class="history-step__pre" tabindex="0"></pre>
        </details>
    </li>
</template>
