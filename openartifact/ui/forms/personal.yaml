# The form of the Personal settings page (ADR-062): display preferences and the data storage limits of the single user.
# The window around it (the title with the name, Save and Cancel) is a component of its own.
schema: 1
name: personal
columns: 2
width: 50
sections:
  - key: display
    title: Display
    column: 1
    fields:
      - key: mark_resolved_references
        widget: switch
        label: Mark resolved references
        help: Highlight ${card.X} references in artifact dialog and board cards with a coloured background and show a legend.
        default: false
  - key: stop
    title: Execution
    column: 1
    fields:
      - key: show_stop_switch
        widget: switch
        label: Show the emergency stop
        help: Offers the emergency stop on the Executions page, in the API and in MCP. While the emergency stop is on, no execution starts and every running one is aborted.
        default: false
  - key: storage
    title: Data storage
    column: 2
    fields:
      - key: storage_keep_executions
        widget: number
        label: "Executions kept per artifact"
        help: "How many of the newest executions of each artifact are kept; older ones are deleted with their steps. Empty uses the operator's default (50). 0 keeps all. The rules that also delete executions are under Executions, Retention."
        placeholder: "Operator default (50)"
        default: null
        min: 0
        max: 100000
      - key: storage_step_data_days
        widget: number
        label: "Empty step outputs after (days)"
        help: "The outputs and details of the steps of a finished execution older than this are removed; the execution, its steps and their results stay. Empty is off."
        placeholder: "Off"
        default: null
        min: 1
        max: 36500
      - key: storage_run_data_mib
        widget: number
        label: "Limit for the data of all executions (MiB)"
        help: "When the outputs, details and contexts of all executions together are larger, the oldest finished executions lose their step outputs and details until it fits. Empty is off."
        placeholder: "Off"
        default: null
        min: 1
        max: 1000000
      - key: storage_step_output_kib
        widget: number
        label: "Longest stored output of a step (KiB)"
        help: "A longer output (and every long text in the details of a step: prompts, tool results) is cut when it is stored; the cut is marked. Empty keeps today's limit (256 KiB)."
        placeholder: "256"
        default: null
        min: 1
        max: 256
      - key: storage_run_output_kib
        widget: number
        label: "Longest stored output of an execution (KiB)"
        help: "All stored outputs of one execution together; the oldest are replaced by a note when it is exceeded. Empty keeps today's limit (1024 KiB)."
        placeholder: "1024"
        default: null
        min: 1
        max: 1024
      - key: storage_clean_interval_hours
        widget: number
        label: "Clean automatically every (hours)"
        help: "The cleaner applies the limits above and the retention rules, and shrinks the write-ahead log. It deletes nothing you have not set a limit for. Empty is off; Clean now is always available."
        placeholder: "Off"
        default: null
        min: 1
        max: 8760
      - key: storage_warn_mib
        widget: number
        label: "Warn when the database is larger than (MiB)"
        help: "Shows a hint in this section when the database file is larger. Empty is off."
        placeholder: "Off"
        default: null
        min: 1
        max: 10000000
