# The form of the Personal settings page (ADR-062): display preferences and the data storage limits of the single user.
# The page has tabs (General, Data storage, Database): a section names its tab. The window around it is a component of its own.
schema: 1
name: personal
columns: 1
width: 44
sections:
  - key: display
    title: Display
    tab: general
    column: 1
    fields:
      - key: mark_resolved_references
        widget: switch
        label: Mark resolved references
        help: Highlight ${card.X} references in artifact dialog and board cards with a coloured background and show a legend.
        default: false
  - key: stop
    title: Execution
    tab: general
    column: 1
    fields:
      - key: show_stop_switch
        widget: switch
        label: Show the emergency stop
        help: Offers the emergency stop on the Executions page, in the API and in MCP. While the emergency stop is on, no execution starts and every running one is aborted.
        default: false
  - key: storage
    title: Data storage
    tab: storage
    column: 1
    fields:
      - key: storage_keep_executions
        widget: limit
        label: "Executions kept per artifact"
        help: "The newest executions of each artifact stay; older ones are deleted with their steps. Default: the operator's number (50). 0 keeps all."
        default: null
        min: 0
        max: 100000
        config:
          unit: executions
          default_value: 50
      - key: storage_step_output_kib
        widget: limit
        label: "Longest stored output of a step"
        help: "A longer output, and every long text in a step's details, is cut when stored; the cut is marked. Default: 256 KiB, the most possible."
        default: null
        min: 1
        max: 256
        config:
          unit: KiB
          default_value: 256
      - key: storage_run_output_kib
        widget: limit
        label: "Longest stored output of an execution"
        help: "All stored outputs of one execution together; the oldest become a note when it is exceeded. Default: 1024 KiB, the most possible."
        default: null
        min: 1
        max: 1024
        config:
          unit: KiB
          default_value: 1024
      - key: storage_step_data_days
        widget: optional-number
        label: "Empty step outputs after"
        help: "Outputs and details of finished executions older than this are removed; the executions, their steps and results stay. Default: off."
        default: null
        min: 1
        max: 36500
        config:
          unit: days
          on_value: 30
      - key: storage_run_data_mib
        widget: optional-number
        label: "Limit for the data of all executions"
        help: "When all outputs, details and contexts together are larger, the oldest finished executions lose them until it fits. Default: off."
        default: null
        min: 1
        max: 1000000
        config:
          unit: MiB
          on_value: 1024
      - key: storage_clean_interval_hours
        widget: optional-number
        label: "Clean automatically"
        help: "Applies the limits above and your retention rules every few hours and shrinks the write-ahead log; deletes nothing you set no limit for. Default: off."
        default: null
        min: 1
        max: 8760
        config:
          unit: hours
          on_value: 24
          every: true
      - key: storage_warn_mib
        widget: optional-number
        label: "Warn when the database is larger than"
        help: "Shows a hint on the Database tab when the database file is larger. Default: off."
        default: null
        min: 1
        max: 10000000
        config:
          unit: MiB
          on_value: 1024
