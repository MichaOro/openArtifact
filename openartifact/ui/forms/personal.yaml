# The form of the Personal settings page (ADR-062): display preferences for the single user.
# The window around it (the title with the name, Save and Cancel) is a component of its own.
schema: 1
name: personal
columns: 2
width: 50
sections:
  - key: display
    title: Display
    column: 1
    fields:
      - key: mark_resolved_references
        widget: switch
        label: Mark resolved references
        help: Highlight ${card.X} references in artifact dialog and board cards with a coloured background and show a legend.
        default: false
  - key: stop
    title: Execution
    column: 1
    fields:
      - key: show_stop_switch
        widget: switch
        label: Show the STOP switch
        help: Offers the STOP switch on the Executions page, in the API and in MCP. While STOP is on, no execution starts and every running one is aborted.
        default: false
