# The form of the credential window (ADR-062, ADR-065): the kind of credential, its name and the values of that kind. The window around it
# (title, Save and Cancel) is a component of its own; the fields of each kind are the ones declared in credentials/types.py (a test keeps
# the two the same). Used by the Credentials page and by the credential field of a node.
schema: 1
name: credential
columns: 1
width: 28
sections:
  - key: general
    title: Credential
    fields:
      - key: type
        widget: select
        label: Type
        required: true
        config: {options_from_code: true}
      - key: name
        widget: text
        label: Name
        required: true
        help: 'Nodes find the credential by this name: capitals, digits and underscores, starting with a letter.'
        config: {max_length: 64}
      - key: description
        widget: text
        label: Description
        config: {max_length: 500}
  - key: expiry
    title: Expiry
    fields:
      - key: expires
        widget: select
        label: Expires
        default: never
        visible_when: {field: type, in: [api_access_token, mcp_access_token]}
        options:
          - {value: never, label: Never}
          - {value: '86400', label: In 1 day}
          - {value: '2592000', label: In 30 days}
          - {value: '7776000', label: In 90 days}
          - {value: '31536000', label: In 1 year}
  - key: value
    title: Access
    fields:
      - key: github_pat.value
        widget: text
        label: Token
        required: true
        placeholder: ghp_…
        visible_when: {field: type, equals: github_pat}
        config: {secret: true, max_length: 8192}
      - key: github_pat.base_url
        widget: text
        label: GitHub server
        placeholder: https://api.github.com
        help: 'Empty: github.com. GitHub Enterprise: https://HOST/api/v3'
        visible_when: {field: type, equals: github_pat}
        config: {max_length: 8192}
      - key: openrouter_api_key.value
        widget: text
        label: API key
        required: true
        placeholder: sk-or-…
        visible_when: {field: type, equals: openrouter_api_key}
        config: {secret: true, max_length: 8192}
      - key: openai_compatible_api_key.value
        widget: text
        label: API key
        required: true
        visible_when: {field: type, equals: openai_compatible_api_key}
        config: {secret: true, max_length: 8192}
      - key: openai_compatible_api_key.base_url
        widget: text
        label: Address (for the test)
        placeholder: https://llm.example/v1
        visible_when: {field: type, equals: openai_compatible_api_key}
        config: {max_length: 8192}
      - key: postgres_connection.value
        widget: text
        label: Connection URL
        required: true
        placeholder: postgresql://user:password@host:5432/database
        visible_when: {field: type, equals: postgres_connection}
        config: {secret: true, max_length: 8192}
      - key: bearer_token.value
        widget: text
        label: Token
        required: true
        visible_when: {field: type, equals: bearer_token}
        config: {secret: true, max_length: 8192}
      - key: mcp_auth.value
        widget: text
        label: Token
        required: true
        visible_when: {field: type, equals: mcp_auth}
        config: {secret: true, max_length: 8192}
      - key: generic_api_key.value
        widget: text
        label: Value
        required: true
        visible_when: {field: type, equals: generic_api_key}
        config: {secret: true, max_length: 8192}
