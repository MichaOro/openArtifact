# The form of the window that makes or changes an agent (ADR-062, ADR-065, ADR-069): its name and what it is for. The prompts and the
# settings are edited on the agent's own page.
schema: 1
name: agent
columns: 1
width: 28
sections:
  - key: general
    title: Agent
    fields:
      - key: name
        widget: text
        label: Name
        required: true
        config: {max_length: 100}
      - key: description
        widget: textarea
        label: Description
        placeholder: What this agent does, in a sentence or two
        config: {max_length: 2000}
