schema: 1
kind: action
label: Action
behaviour: action
scopes:
- pipeline
links_to: action
menu_icon: action
ports:
  inputs:
  - name: in
    label: Input
  outputs:
  - name: pass
    label: On Pass
  - name: error
    label: On Error
    visible_when:
      setting: on_failure
      equals: error_output
ui:
  color: action
  size:
    width: 190
    height: 68
  port_labels: true
settings:
- use: on_failure
  label: If the action fails
  help: Stop the run ends the run as failed; Continue goes on through On Pass and keeps the error as data. Error
    output goes on through On Error, which shows only then.
- use: retry
  label: Retry on fail
  help: Runs the action again when it fails, all its nodes; the run does not start over. Writes in it (HTTP, Postgres, GitHub)
    can happen twice.
- key: input_values
  label: Inputs
  type: mapping
  default: {}
  help: 'The value of each input of what this node runs: a text, a card field (${card.name}) or a reference to the outputs of an earlier node (${node:ID.data.name}). An input left empty uses its default; a required one without a value fails.'
  stored_in: config
