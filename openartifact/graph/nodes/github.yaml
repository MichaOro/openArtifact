schema: 1
kind: github
label: GitHub
behaviour: flow
produces_result: true
timed: true
guardable: true
scopes:
- action
addable: true
chain: true
reference_keys:
- repository
- number
- path
- ref
- comment
menu:
  group: Apps and data
  order: 1
ports:
  inputs:
  - name: in
    label: Input
  outputs:
  - name: pass
    label: On Pass
  - name: fail
    label: On Fail
    visible_when:
      setting: on_failure
      equals: error_output
ui:
  color: github
  icon: github
  hint: This node is for connecting to and working with GitHub, the remote.
  caption:
    template: '{operation|default:Get repository}{?operation=Create comment&!allow_comments: (off)} · {repository|trim|short|default:no
      repository yet}'
settings:
- key: secret
  label: Credential
  type: credential
  credential_types:
  - github_pat
  default: ''
  max_length: 64
  help: A GitHub access token (classic or fine-grained), kept in the credentials. Empty - no token (public data, a low rate limit).
  stored_in: config
  check: secret_name
- key: resource
  label: Resource
  type: select
  default: Repository
  options:
  - Repository
  - Issue
  - Pull request
  - File
  - Organization
  - Release
  - Review
  - User
  disabled_options:
  - Organization
  - Release
  - Review
  - User
  line: kind
  help: What the node works on. A greyed entry is not built yet.
  stored_in: config
- key: operation
  label: Operation
  type: select
  default: Get repository
  options:
  - Get repository
  - List issues
  - List pull requests
  - Get license
  - Get profile
  - List popular paths
  - List referrers
  - Get issue
  - List comments
  - Create comment
  - Create issue
  - Edit issue
  - Lock issue
  - Get pull request
  - Get pull request diff
  - List pull request files
  - Create pull request
  - Update pull request
  - Get file
  - Create file
  - Edit file
  - Delete file
  - List organization repositories
  - Create release
  - Get release
  - List releases
  - Update release
  - Delete release
  - Create review
  - Get review
  - List reviews
  - Update review
  - List user repositories
  - Invite user
  disabled_options:
  - Get license
  - Get profile
  - List popular paths
  - List referrers
  - Create issue
  - Edit issue
  - Lock issue
  - Create pull request
  - Update pull request
  - Create file
  - Edit file
  - Delete file
  - List organization repositories
  - Create release
  - Get release
  - List releases
  - Update release
  - Delete release
  - Create review
  - Get review
  - List reviews
  - Update review
  - List user repositories
  - Invite user
  options_by:
    setting: resource
    map:
      Repository:
        - Get repository
        - List issues
        - List pull requests
        - Get license
        - Get profile
        - List popular paths
        - List referrers
      Issue:
        - Get issue
        - List comments
        - Create comment
        - Create issue
        - Edit issue
        - Lock issue
      Pull request:
        - Get pull request
        - Get pull request diff
        - List pull request files
        - Create pull request
        - Update pull request
      File:
        - Get file
        - Create file
        - Edit file
        - Delete file
      Organization:
        - List organization repositories
      Release:
        - Create release
        - Get release
        - List releases
        - Update release
        - Delete release
      Review:
        - Create review
        - Get review
        - List reviews
        - Update review
      User:
        - List user repositories
        - Invite user
  option_labels:
    Get pull request diff: Get PR diff
    List pull request files: List PR files
  line: kind
  help: What the node does with the resource. A greyed entry is not built yet.
  stored_in: config
- key: repository
  label: Repository
  type: text
  default: ''
  max_length: 200
  placeholder: owner/name
  help: owner/name, for every operation. May hold ${node...} or ${var...}.
  stored_in: config
  check: repository
  references: context
- key: number
  label: Number
  type: text
  default: ''
  max_length: 40
  help: The number of the issue or pull request (get, comments, files, diff).
  stored_in: config
  check: github_number
  references: context
  shown_when:
    setting: operation
    values:
    - Get issue
    - List comments
    - Create comment
    - Get pull request
    - Get pull request diff
    - List pull request files
- key: path
  label: File path
  type: text
  default: ''
  max_length: 500
  placeholder: docs/README.md
  help: 'Get file: the path in the repository (a folder lists its files).'
  stored_in: config
  check: file_path
  references: context
  shown_when:
    setting: operation
    values:
    - Get file
- key: ref
  label: Git reference
  type: text
  default: ''
  max_length: 200
  help: 'Get file: empty is the default branch.'
  stored_in: config
  level: optional
  shown_when:
    setting: operation
    values:
    - Get file
  check: not_secret
  references: context
- key: state
  label: State
  type: select
  default: open
  options:
  - open
  - closed
  - all
  help: List issues and List pull requests.
  stored_in: config
  shown_when:
    setting: operation
    values:
    - List issues
    - List pull requests
- key: limit
  label: Limit
  type: integer
  minimum: 1
  maximum: 100
  default: 30
  help: The most items a list returns (one page, the newest first).
  stored_in: config
  shown_when:
    setting: operation
    values:
    - List issues
    - List pull requests
    - List pull request files
    - List comments
- key: comment
  label: Comment
  type: lines
  default: ''
  max_length: 20000
  help: 'Create comment: the text, may hold ${node...} or ${var...}; no secrets.'
  stored_in: config
  check: not_secret
  references: context
  shown_when:
    setting: operation
    values:
    - Create comment
- key: allow_comments
  label: Allow comments
  type: switch
  default: false
  help: 'Create comment writes to GitHub: it only runs when this is on. Every other operation reads.'
  stored_in: config
  shown_when:
    setting: operation
    values:
    - Create comment
- use: timeout_seconds
  level: optional
- use: on_failure
