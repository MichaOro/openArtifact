schema: 1
kind: code
label: Execute Command
behaviour: flow
produces_result: true
timed: true
variables:
  setting: sets_variables
  format: lines
guardable: true
scopes:
- action
addable: true
chain: true
menu:
  group: Core
  order: 1
ports:
  inputs:
  - name: in
    label: Input
  outputs:
  - name: pass
    label: On Pass
  - name: fail
    label: On Fail
    visible_when:
      setting: on_failure
      equals: error_output
ui:
  color: code
  icon: code
  caption:
    template: '{language|default:sh} · {code|first_line|default:no code yet}'
settings:
- key: language
  label: Language
  type: select
  default: sh
  options:
  - sh
  - python
  stored_in: config
- key: code
  label: Code
  type: code
  default: ''
  max_length: 20000
  help: 'Not a sandbox: it runs as the application''s user, and the text is stored as it is (no secrets here, no ${...}). The run
    context is context.json; a last line {"ok": true, "vars": {"name": "value"}} sets variables.'
  stored_in: config
- key: secrets
  label: Secrets
  type: lines
  default: ''
  max_length: 2000
  placeholder: API_KEY
  help: One secret name per line; each is an environment variable of that name, like $API_KEY. A missing secret fails the
    node.
  stored_in: config
  check: secret_names
  level: advanced
- key: sets_variables
  label: Sets variables
  type: lines
  default: ''
  max_length: 2000
  placeholder: ticket_priority
  help: 'Optional: the variables this code sets, one per line, as in "vars". They feed the suggestions; a difference is noted
    in the step and does not fail the node.'
  stored_in: config
  check: variable_names
  level: advanced
- key: timeout_seconds
  label: Timeout (seconds)
  type: integer
  minimum: 1
  maximum: 600
  default: 30
  stored_in: config
  group: Execution limits
  section: behaviour
  level: optional
- key: output_limit_bytes
  label: Output limit
  type: size
  minimum: 1024
  maximum: 67108864
  default: null
  help: The most this node keeps of its output and its errors, each; the rest is cut off. Never above the limit of the instance
    (64 KiB unless changed).
  stored_in: config
  section: behaviour
  level: optional
- use: on_failure
- use: retry
