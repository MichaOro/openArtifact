schema: 1
kind: code
label: Code
behaviour: flow
scopes:
- action
addable: true
chain: true
menu:
  group: Core
  order: 1
ports:
  inputs:
  - name: in
    label: Input
  outputs:
  - name: pass
    label: On Pass
  - name: fail
    label: On Fail
    visible_when:
      setting: on_failure
      equals: error_output
ui:
  icon: code
  caption:
    template: '{language|default:sh} · {code|first_line|default:no code yet}'
settings:
- key: language
  label: Language
  type: select
  default: sh
  options:
  - sh
  - python
  stored_in: config
- key: code
  label: Code
  type: code
  default: ''
  max_length: 20000
  help: 'Stored and shown in plain text, so no secrets in here: ${secret:NAME} is not replaced in code, and neither
    are ${node...} or ${var...}. List the secrets the code needs in ''Secrets'' below; they come as environment
    variables. The run context (variables and earlier results) is the file context.json in the working directory.
    To set variables, print a last line like {"ok": true, "vars": {"name": "value"}}.'
  stored_in: config
- key: secrets
  label: Secrets
  type: lines
  default: ''
  max_length: 2000
  placeholder: API_KEY
  help: One secret name per line (capitals, digits, underscores). Each is available to the code as an environment
    variable of that name, for example $API_KEY or os.environ['API_KEY']. Manage the values under Secrets; a missing
    secret fails the node.
  stored_in: config
  check: secret_names
  level: advanced
- key: sets_variables
  label: Sets variables
  type: lines
  default: ''
  max_length: 2000
  placeholder: ticket_priority
  help: 'Optional: the variable names this code sets (one per line, as in "vars"). Documents the node and feeds
    the suggestions; a difference between this list and what the code really sets is noted in the step, it does
    not fail the node.'
  stored_in: config
  check: variable_names
  level: advanced
- key: timeout_seconds
  label: Timeout (seconds)
  type: integer
  minimum: 1
  maximum: 600
  default: 30
  stored_in: config
  group: Execution limits
  section: behaviour
  level: optional
- use: on_failure
