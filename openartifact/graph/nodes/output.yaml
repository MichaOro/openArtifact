schema: 1
kind: output
label: Output
behaviour: output
scopes:
- action
fixed: true
ending: true
menu_icon: inbox
ports:
  inputs:
  - name: pass
    label: On Pass
  - name: fail
    label: On Fail
    visible_when:
      node: fail_enabled
ui:
  color: output
  step_icon: check
  size:
    width: 250
    height: 104
  port_labels: true
settings:
- key: fail_enabled
  label: On Fail
  type: switch
  default: false
- key: outputs
  label: Outputs
  type: fields
  field_extra: value
  default: []
  help: 'What this action hands back to the one that ran it: a name, a type and a value (a text, or references such as ${(Node name).output} or ${input.name}). When it ends On Pass the values are worked out and become the data of the node that ran it, where later nodes read them by that node. Without outputs nothing changes.'
  stored_in: config
