schema: 1
kind: output
label: Output
behaviour: output
scopes:
- action
fixed: true
ending: true
menu_icon: inbox
effect:
  default: none
ports:
  inputs:
  - name: pass
    label: On Pass
  - name: fail
    label: On Fail
    visible_when:
      node: fail_enabled
ui:
  color: output
  step_icon: check
  size:
    width: 250
    height: 104
  port_labels: true
settings:
- key: fail_enabled
  label: On Fail
  type: switch
  default: false
- key: outputs
  label: Outputs
  type: fields
  field_extra: value
  default: []
  help: "What this action hands back: a name, a type and a value (text or references like ${input.who}). Worked out when it ends On Pass, it becomes the data of the node that ran it."
  stored_in: config
