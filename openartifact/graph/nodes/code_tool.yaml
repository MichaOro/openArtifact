schema: 1
kind: code_tool
label: Execute Command Tool
behaviour: tool
scopes:
- action
addable: true
tool: true
menu:
  group: Agent tools
  order: 3
effect:
  default: write
  flag: read_only
  flag_true: read
ports:
  outputs:
  - name: tool
    label: Tool
    side: top
ui:
  color: code
  icon: code
  caption:
    template: '{language|default:python} · {tool_name|default:@name}'
settings:
- use: tool_name
- key: description
  label: Description
  type: lines
  default: ''
  max_length: 1000
  help: Tells the model what the tool does and when to use it. Name the parameters it takes below.
  stored_in: config
- key: language
  label: Language
  type: select
  default: python
  options:
  - sh
  - python
  stored_in: config
- key: code
  label: Code
  type: code
  default: ''
  max_length: 20000
  help: "The model's arguments are 'input' in context.json; what the code prints is the answer. Not a sandbox: it runs as the
    application's user."
  stored_in: config
- key: secrets
  label: Secrets
  type: lines
  default: ''
  max_length: 2000
  placeholder: API_KEY
  help: One secret name per line, available as environment variables.
  stored_in: config
  check: secret_names
- use: parameters
- key: timeout_seconds
  label: Timeout (seconds)
  type: integer
  minimum: 1
  maximum: 600
  default: 30
  stored_in: config
- key: read_only
  label: Read only
  type: switch
  default: false
  level: optional
  help: Tick it when this code only reads and changes nothing. A dry run then runs it; otherwise it skips it as a change.
  stored_in: config
