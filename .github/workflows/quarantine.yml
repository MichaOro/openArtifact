# Weekly check of quarantined code (quarantine.json, tools/check_quarantine.py): fails when an entry
# has been unused for its 14 days, as a reminder to remove the code and the entry.
name: Quarantine

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "quarantine.json"
      - "tools/check_quarantine.py"

permissions:
  contents: read

jobs:
  check:
    name: Unused quarantined code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/check_quarantine.py
