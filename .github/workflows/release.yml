# Release Workflow — OpenArtifact
#
# Triggered by pushing a version tag with a "v" prefix (v0.1.0, v1.0.0); other tags do not match.
#
# Steps:
#   1. Build and publish the Docker image to GHCR (the repository name is lower-cased)
#   2. Image tags: <version>, <version>.<run number>, sha-<commit> and latest
#   3. Create a GitHub Release with generated release notes
#
# Prerequisites:
#   - Repository setting: "Allow GitHub Actions to create and publish packages"
#     Settings → Actions → General → Workflow permissions → Read and write permissions
#   - Repository setting: "Packages" write access is granted to Actions

name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write
  packages: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract version from tag
        id: version
        run: |
          # Strip leading 'v' if present
          TAG="${GITHUB_REF#refs/tags/}"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "version=${TAG#v}" >> $GITHUB_OUTPUT
          echo "short_sha=${GITHUB_SHA::8}" >> $GITHUB_OUTPUT
          # Image references must be lower case; the repository name may not be.
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> $GITHUB_OUTPUT
          echo "Extracted version: ${TAG#v}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ steps.version.outputs.image }}:${{ steps.version.outputs.version }}
            ${{ steps.version.outputs.image }}:${{ steps.version.outputs.version }}.${{ github.run_number }}
            ${{ steps.version.outputs.image }}:sha-${{ github.sha }}
            ${{ steps.version.outputs.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: |
            org.openartifact.commit=${{ github.sha }}
            org.openartifact.version=${{ steps.version.outputs.version }}
            org.openartifact.released=${{ steps.version.outputs.tag }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: OpenArtifact ${{ steps.version.outputs.version }}
          body: |
            ## Release ${{ steps.version.outputs.version }}

            **Commit:** `${{ steps.version.outputs.short_sha }}`
            **Triggered by tag:** `${{ steps.version.outputs.tag }}`

            ### Image
            Pull with:
            ```
            docker pull ${{ steps.version.outputs.image }}:${{ steps.version.outputs.version }}
            ```
          draft: false
          prerelease: false
          generate_release_notes: true
