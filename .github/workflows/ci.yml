# CI/CD Pipeline — OpenArtifact
#
# Triggers:
#   - PRs targeting main
#   - Pushes to main
#
# Stages:
#   1. Python linting + formatting (Ruff)
#   2. Strict type checking (mypy)
#   3. Test execution + coverage
#   4. Browser tests (Playwright, headless Chromium)
#   5. Docker image build + smoke test, run as deployed (read-only, no capabilities, token)
#
# Beside the Python stages: a JavaScript syntax check and a Markdown link check (job "static").
#
# Python dependencies come from uv.lock (uv sync --frozen); job "lint" fails when the lock is stale.
# Dependency audit runs in audit.yml.

name: CI

on:
  push:
    branches: [main]
    paths:
      - "openartifact/**"
      - "tests/**"
      - "alembic/**"
      - "alembic.ini"
      - "pyproject.toml"
      - "uv.lock"
      - "docs/**"
      - "**/*.md"
      - "Dockerfile"
      - ".dockerignore"
      - "deploy/**"
      - "scripts/**"
      - "tools/**"
      - "quarantine.json"
      - ".github/**"
  pull_request:
    branches: [main]
    paths:
      - "openartifact/**"
      - "tests/**"
      - "alembic/**"
      - "alembic.ini"
      - "pyproject.toml"
      - "uv.lock"
      - "docs/**"
      - "**/*.md"
      - "Dockerfile"
      - ".dockerignore"
      - "deploy/**"
      - "scripts/**"
      - "tools/**"
      - "quarantine.json"
      - ".github/**"

permissions:
  contents: read

# The uv release every job installs with (uv.lock is written by it; the Dockerfile pins the same release).
env:
  UV_VERSION: "0.13.9"

jobs:
  # ── Stage 1: Python Quality Checks ──────────────────────────────

  lint:
    name: Ruff (lint + format)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.4.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.12"

      # Fails when pyproject.toml changed without `uv lock`; every job below installs from uv.lock.
      - name: Lock file is up to date
        run: |
          uv lock --check

      - name: Install dev dependencies (uv.lock)
        run: |
          uv sync --frozen --all-extras

      - name: Ruff lint
        run: |
          uv run --no-sync ruff check .

      - name: Ruff format check
        run: |
          uv run --no-sync ruff format --check .

  # ── Static checks: JavaScript syntax, Markdown links ────────────

  static:
    name: JavaScript syntax + Markdown links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: JavaScript syntax (node --check)
        run: |
          # The sources are ES modules: check copies with the .mjs extension.
          tmp="$(mktemp -d)"
          status=0
          while IFS= read -r -d '' f; do
            cp "$f" "$tmp/check.mjs"
            node --check "$tmp/check.mjs" || { echo "::error file=$f::syntax error"; status=1; }
          done < <(find openartifact/static/js -name '*.js' -print0)
          exit $status

      - name: JavaScript unit tests (node --test)
        run: node --test 'tests/js/*.test.mjs'

      - name: Markdown relative links and anchors
        run: python tools/check_links.py

      - name: Quarantine
        run: python tools/check_quarantine.py

  # ── Stage 2: Type Checking ──────────────────────────────────────

  type-check:
    name: mypy (strict)
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.4.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.12"

      - name: Install dev dependencies (uv.lock)
        run: |
          uv sync --frozen --all-extras

      - name: mypy strict type check
        run: |
          uv run --no-sync mypy .

  # ── Stage 3: Test Suite ─────────────────────────────────────────

  test:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: [type-check]
    strategy:
      matrix:
        python-version: ["3.12"]
    # A real Postgres server for the tests of the Postgres node and tool (tests/postgres_support.py): without
    # one those tests are skipped, which would hide the checks that the database itself enforces read-only.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: oa
          POSTGRES_PASSWORD: pw
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U oa"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.4.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ matrix.python-version }}

      - name: Install dev dependencies (uv.lock)
        run: |
          uv sync --frozen --all-extras

      - name: Run test suite with coverage
        env:
          OA_TEST_POSTGRES_URL: postgresql://oa:pw@127.0.0.1:5432/postgres
        run: |
          uv run --no-sync coverage run -m pytest -v --tb=short
          uv run --no-sync coverage report
          uv run --no-sync coverage xml

      - name: Upload coverage
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 30

  # ── Stage 4: Browser Tests ──────────────────────────────────────

  e2e:
    name: Browser tests (Playwright)
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.4.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.12"

      - name: Install dependencies (uv.lock) and browser
        run: |
          uv sync --frozen --all-extras
          uv run --no-sync playwright install --with-deps chromium

      - name: Run browser tests
        run: |
          uv run --no-sync python -m pytest -m e2e -v --tb=short --tracing retain-on-failure

      - name: Keep traces of failed tests
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces
          path: test-results/
          if-no-files-found: ignore

  # ── Stage 5: Docker Build + Smoke Test ──────────────────────────

  docker:
    name: Docker build + smoke test
    runs-on: ubuntu-latest
    needs: [test, e2e]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          load: true
          tags: openartifact:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Runs the image like deploy/docker-compose.yml: read-only root, tmpfs /tmp, no capabilities,
      # no-new-privileges, a throw-away token and key. Imports every module, waits for /health,
      # expects 401 on /api/tasks without the token and 200 with it.
      - name: Container smoke test
        run: tools/smoke_container.sh openartifact:test
