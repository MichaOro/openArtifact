# CI/CD Pipeline — OpenArtifact
#
# Triggers:
#   - PRs targeting main
#   - Pushes to main
#
# Stages:
#   1. Python linting + formatting (Ruff)
#   2. Strict type checking (mypy)
#   3. Test execution + coverage
#   4. Browser tests (Playwright, headless Chromium)
#   5. Docker image build + smoke test (main branch only)

name: CI

on:
  push:
    branches: [main]
    paths:
      - "apps/backend/**"
      - "Dockerfile"
      - ".dockerignore"
      - "deploy/**"
      - "pyproject.toml"
      - ".github/workflows/**"
  pull_request:
    branches: [main]
    paths:
      - "apps/backend/**"
      - "Dockerfile"
      - ".dockerignore"
      - "deploy/**"
      - "pyproject.toml"
      - ".github/workflows/**"

permissions:
  contents: read

jobs:
  # ── Stage 1: Python Quality Checks ──────────────────────────────

  lint:
    name: Ruff (lint + format)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dev dependencies
        run: |
          cd apps/backend
          pip install --no-cache-dir -e ".[dev]"

      - name: Ruff lint
        run: |
          cd apps/backend
          ruff check .

      - name: Ruff format check
        run: |
          cd apps/backend
          ruff format --check .

  # ── Stage 2: Type Checking ──────────────────────────────────────

  type-check:
    name: mypy (strict)
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dev dependencies
        run: |
          cd apps/backend
          pip install --no-cache-dir -e ".[dev]"

      - name: mypy strict type check
        run: |
          cd apps/backend
          mypy .

  # ── Stage 3: Test Suite ─────────────────────────────────────────

  test:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: [type-check]
    strategy:
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dev dependencies
        run: |
          cd apps/backend
          pip install --no-cache-dir -e ".[dev]"

      - name: Run test suite
        run: |
          cd apps/backend
          python -m pytest -v --tb=short

      - name: Generate coverage report
        run: |
          cd apps/backend
          coverage run -m pytest -q
          coverage report
          coverage xml

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: apps/backend/coverage.xml
          retention-days: 30

  # ── Stage 4: Browser Tests ──────────────────────────────────────

  e2e:
    name: Browser tests (Playwright)
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies and browser
        run: |
          cd apps/backend
          pip install --no-cache-dir -e ".[dev]"
          playwright install --with-deps chromium

      - name: Run browser tests
        run: |
          cd apps/backend
          python -m pytest -m e2e -v --tb=short --tracing retain-on-failure

      - name: Keep traces of failed tests
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: apps/backend/test-results/
          if-no-files-found: ignore

  # ── Stage 5: Docker Build + Smoke Test (main only) ──────────────

  docker:
    name: Docker build + smoke test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [test, e2e]
    permissions:
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          load: true
          tags: openartifact:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Container smoke test
        run: |
          # Start container in detached mode with named volume
          docker run -d \
            --name openartifact-smoke \
            -p 2909:2909 \
            -e OPENARTIFACT_DATA_DIR=/data \
            -e OPENARTIFACT_SECRET_KEY=smoke-test-key \
            -e OPENARTIFACT_LOG_LEVEL=DEBUG \
            openartifact:test

          # Wait for migrations and server startup (max 15s)
          echo "Waiting for server startup..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:2909/health > /dev/null 2>&1; then
              echo "Server is healthy!"
              break
            fi
            if [ $i -eq 30 ]; then
              echo "ERROR: Server failed to start within 15 seconds"
              docker logs openartifact-smoke
              exit 1
            fi
            sleep 0.5
          done

          # Verify health endpoint
          echo "Health check response:"
          curl -sf http://localhost:2909/health

          # Verify web interface
          echo ""
          echo "Web interface check:"
          curl -sf -o /dev/null -w "%{http_code}" http://localhost:2909/

          # Verify /api/info endpoint
          echo ""
          echo "API info check:"
          curl -sf http://localhost:2909/api/info

          # Cleanup
          docker rm -f openartifact-smoke
