# CI/CD Pipeline — OpenArtifact
#
# Triggers:
#   - PRs targeting main
#   - Pushes to main
#
# Stages:
#   1. Python linting + formatting (Ruff)
#   2. Strict type checking (mypy)
#   3. Test execution + coverage
#   4. Browser tests (Playwright, headless Chromium)
#   5. Docker image build + smoke test, run as deployed (read-only, no capabilities, token)
#
# Beside the Python stages: a JavaScript syntax check and a Markdown link check (job "static").
#
# Dependency audit runs in audit.yml.

name: CI

on:
  push:
    branches: [main]
    paths:
      - "apps/backend/**"
      - "docs/**"
      - "**/*.md"
      - "Dockerfile"
      - ".dockerignore"
      - "deploy/**"
      - "scripts/**"
      - "tools/**"
      - "quarantine.json"
      - ".github/**"
  pull_request:
    branches: [main]
    paths:
      - "apps/backend/**"
      - "docs/**"
      - "**/*.md"
      - "Dockerfile"
      - ".dockerignore"
      - "deploy/**"
      - "scripts/**"
      - "tools/**"
      - "quarantine.json"
      - ".github/**"

permissions:
  contents: read

jobs:
  # ── Stage 1: Python Quality Checks ──────────────────────────────

  lint:
    name: Ruff (lint + format)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dev dependencies
        run: |
          cd apps/backend
          pip install --no-cache-dir -e ".[dev]"

      - name: Ruff lint
        run: |
          cd apps/backend
          ruff check .

      - name: Ruff format check
        run: |
          cd apps/backend
          ruff format --check .

  # ── Static checks: JavaScript syntax, Markdown links ────────────

  static:
    name: JavaScript syntax + Markdown links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: JavaScript syntax (node --check)
        run: |
          # The sources are ES modules: check copies with the .mjs extension.
          tmp="$(mktemp -d)"
          status=0
          while IFS= read -r -d '' f; do
            cp "$f" "$tmp/check.mjs"
            node --check "$tmp/check.mjs" || { echo "::error file=$f::syntax error"; status=1; }
          done < <(find apps/backend/openartifact/static/js -name '*.js' -print0)
          exit $status

      - name: JavaScript unit tests (node --test)
        run: node --test 'apps/backend/tests/js/*.test.mjs'

      - name: Markdown relative links and anchors
        run: python tools/check_links.py

      - name: Quarantine
        run: python tools/check_quarantine.py

  # ── Stage 2: Type Checking ──────────────────────────────────────

  type-check:
    name: mypy (strict)
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dev dependencies
        run: |
          cd apps/backend
          pip install --no-cache-dir -e ".[dev]"

      - name: mypy strict type check
        run: |
          cd apps/backend
          mypy .

  # ── Stage 3: Test Suite ─────────────────────────────────────────

  test:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: [type-check]
    strategy:
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dev dependencies
        run: |
          cd apps/backend
          pip install --no-cache-dir -e ".[dev]"

      - name: Run test suite with coverage
        run: |
          cd apps/backend
          coverage run -m pytest -v --tb=short
          coverage report
          coverage xml

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: apps/backend/coverage.xml
          retention-days: 30

  # ── Stage 4: Browser Tests ──────────────────────────────────────

  e2e:
    name: Browser tests (Playwright)
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies and browser
        run: |
          cd apps/backend
          pip install --no-cache-dir -e ".[dev]"
          playwright install --with-deps chromium

      - name: Run browser tests
        run: |
          cd apps/backend
          python -m pytest -m e2e -v --tb=short --tracing retain-on-failure

      - name: Keep traces of failed tests
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: apps/backend/test-results/
          if-no-files-found: ignore

  # ── Stage 5: Docker Build + Smoke Test ──────────────────────────

  docker:
    name: Docker build + smoke test
    runs-on: ubuntu-latest
    needs: [test, e2e]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          load: true
          tags: openartifact:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Runs the image like deploy/docker-compose.yml: read-only root, tmpfs /tmp, no capabilities,
      # no-new-privileges, a throw-away token and key. Imports every module, waits for /health,
      # expects 401 on /api/tasks without the token and 200 with it.
      - name: Container smoke test
        run: tools/smoke_container.sh openartifact:test
