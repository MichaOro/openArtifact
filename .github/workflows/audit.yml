# Known vulnerabilities in the locked runtime dependencies (pip-audit), weekly and when the
# dependency list or the lock changes. The set is exported from uv.lock, as in the image.
name: Audit

on:
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/audit.yml"

permissions:
  contents: read

jobs:
  pip-audit:
    name: pip-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          version: "0.13.9"
          python-version: "3.12"
      - name: Locked runtime dependencies
        run: |
          # The runtime part of uv.lock with hashes, the same list the Dockerfile installs (also printed to the log).
          uv export --frozen --no-dev --no-emit-project --format requirements-txt --output-file "$RUNNER_TEMP/requirements.txt"
      - name: Audit them
        run: |
          pip install --no-cache-dir pip-audit
          # -r installs the pinned, hashed list in a throw-away environment and audits what comes out.
          pip-audit -r "$RUNNER_TEMP/requirements.txt" --require-hashes --progress-spinner off
