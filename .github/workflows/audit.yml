# Known vulnerabilities in the installed runtime dependencies (pip-audit), weekly and when the
# dependency list changes. The versions are the ones a fresh install resolves today, as in the image.
name: Audit

on:
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "apps/backend/pyproject.toml"
      - ".github/workflows/audit.yml"

permissions:
  contents: read

jobs:
  pip-audit:
    name: pip-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the application into its own environment
        run: |
          python -m venv "$RUNNER_TEMP/app"
          "$RUNNER_TEMP/app/bin/pip" install --no-cache-dir apps/backend
      - name: Audit it
        run: |
          pip install --no-cache-dir pip-audit
          pip-audit --path "$RUNNER_TEMP"/app/lib/python3.12/site-packages
