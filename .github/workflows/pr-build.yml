# PR Build Workflow — OpenArtifact
#
# Triggered on pull request pushes.
# Builds the Docker image for preview but does NOT publish.
# This allows contributors to verify their Docker changes locally.

name: PR Build

on:
  pull_request:
    branches: [main]
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "openartifact/**"
      - "tests/**"
      - "alembic/**"
      - "alembic.ini"
      - "pyproject.toml"
      - "uv.lock"
      - "deploy/**"
      - "scripts/**"
      - "tools/smoke_container.sh"
      - ".github/workflows/**"

permissions:
  contents: read

jobs:
  docker-build:
    name: Docker build (PR preview)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          load: true
          tags: openartifact:pr-${{ github.event.pull_request.number }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
