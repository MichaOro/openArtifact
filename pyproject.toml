[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "openartifact"
dynamic = ["version"]
description = "OpenArtifact — Orchestrate projects, pipelines, and AI agents around structured artifacts"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
authors = [
    { name = "OpenArtifact Contributors" },
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "fastapi>=0.115.0",
    "starlette>=1.6.0",
    "uvicorn[standard]>=0.34.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "aiosqlite>=0.21.0",
    "alembic>=1.14.0",
    "jinja2>=3.1.5",
    "mcp>=2.3.0",
    "cryptography>=41.0.0",
    "pyjwt[crypto]>=2.8.0",
    "httpx>=0.28.0",
    "psycopg[binary]>=3.1.17",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.9.0",
    "mypy>=1.14.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "pytest-xdist>=3.6.0",
    "pytest-timeout>=2.3.0",
    "coverage>=7.6.0",
    "pytest-playwright>=0.6.0",
]

[project.scripts]
openartifact = "openartifact.cli:main"

[tool.hatch.version]
path = "openartifact/version.py"

[tool.hatch.build.targets.wheel]
packages = ["openartifact"]

[tool.ruff]
target-version = "py312"
line-length = 100
# Markdown has its own checks (tools/check_links.py); ruff formats Python only.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "F",      # pyflakes
    "I",      # isort
    "N",      # pep8-naming
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "SIM",    # flake8-simplify
    "T20",    # flake8-print
    "RUF",    # ruff rules
]
ignore = [
    "E501",   # line length handled by formatter
]

[tool.ruff.lint.per-file-ignores]
# Command-line tools report on standard output.
"tools/*" = ["T201"]

[tool.ruff.lint.isort]
known-first-party = ["openartifact"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true

[[tool.mypy.overrides]]
# PyYAML ships no type information (it reads the node manifests, ADR-054).
module = "yaml"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
# A hanging test fails after two minutes instead of stalling the run. Parallel runs are opt-in: `pytest -n auto`.
timeout = 120
# Browser tests are slow and need a browser: run them explicitly with `pytest -m e2e`.
addopts = "-m 'not e2e'"
markers = ["e2e: browser tests against a running application (pytest -m e2e)"]
filterwarnings = [
    "error",
    "ignore::DeprecationWarning",
    "ignore::starlette.exceptions.StarletteDeprecationWarning",
]

[tool.coverage.run]
source = ["openartifact"]
branch = true
# SQLAlchemy's async layer switches greenlets: without this every line after an awaited query counts as missed.
concurrency = ["greenlet", "thread"]
omit = [
    "*/tests/*",
    "*/cli.py",
]

[tool.coverage.report]
show_missing = true
fail_under = 95
